version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_SETTINGS_MODULE=jewelry_store.settings
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jewelry}:${POSTGRES_PASSWORD:-jewelry123}@db:5432/${POSTGRES_DB:-jewelry}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 jewelry_store.wsgi:application"
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-jewelry}
      - POSTGRES_USER=${POSTGRES_USER:-jewelry}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jewelry123}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:

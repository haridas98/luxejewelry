version: '3.8'

services:
  # Backend (Django)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=your-secret-key-change-in-production
      - DATABASE_URL=sqlite:///db.sqlite3
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 jewelry_store.wsgi:application"
    depends_on:
      - db

  # Database (PostgreSQL for production, SQLite for dev)
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=jewelry
      - POSTGRES_USER=jewelry
      - POSTGRES_PASSWORD=jewelry123
    profiles:
      - production

  # Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Development mode (optional - for hot reload)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    command: npm start
    profiles:
      - development

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  default:
    name: jewelry-network
